name: QuranKu Testing APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Bundle CC0 rain ambience
        run: python3 scripts/update_rain_asset.py

      - name: Apply UI localization and live player patch
        run: python3 scripts/patch_ui_indonesian.py

      - name: Apply final UI and translation fixes
        run: python3 scripts/fix_ui_final.py

      - name: Apply typography and visual polish
        run: python3 scripts/patch_typography_and_light_ui.py

      - name: Apply HIG design system to all screens
        run: python3 scripts/apply_hig_all_screens.py

      - name: Apply reader redesign prompt
        run: python3 scripts/apply_reader_redesign.py

      - name: Normalize theme labels
        run: python3 scripts/theme_label_override.py

      - name: Sync app version and search spacing
        run: python3 scripts/app_metadata_and_spacing.py

      - name: Apply mushaf-style reader layout
        run: python3 scripts/patch_mushaf_reader.py

      - name: Refine Tajweed rendering and Arabic typography
        run: python3 scripts/refine_tajwid_and_arabic_font.py

      - name: Enable reader view toggle
        run: python3 scripts/fix_reader_view_toggle.py

      - name: Fix bookmark behavior
        run: python3 scripts/fix_bookmark_behavior.py

      - name: Apply unified top navbar style
        run: python3 scripts/top_navbar_style.py

      - name: Balance resume card spacing
        run: python3 scripts/fix_resume_spacing.py

      - name: Refine background audio controls
        run: python3 scripts/patch_background_audio_ui.py

      - name: Ensure background audio async import
        run: python3 scripts/ensure_full_player_async.py

      - name: Analyze Dart source
        run: dart analyze --no-fatal-warnings

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/quranku-release.jks
          test -s android/app/quranku-release.jks

      - name: Build release APK for explicit signing
        env:
          MANUAL_APK_SIGNING: 'true'
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/quranku-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD Secret is missing."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS Secret is missing."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD Secret is missing."; exit 1; }
          flutter clean
          flutter pub get
          flutter build apk \
            --release \
            --build-name "3.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Explicitly sign APK with v1/v2/v3
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/quranku-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APKSIGNER_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APKSIGNER_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ALIGNED="build/app/outputs/flutter-apk/app-release-aligned.apk"
          SIGNED="build/app/outputs/flutter-apk/app-release-signed.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          test -s "$APK"
          test -s "$ANDROID_KEYSTORE_PATH"

          echo "== Re-align APK before signing =="
          # zipalign rejects using -p together with -P. For 16 KB-safe JNI
          # alignment, use -P 16 with the normal 4-byte entry alignment.
          "$BUILD_TOOLS_DIR/zipalign" -f -P 16 4 "$APK" "$ALIGNED"

          echo "== Sign with explicit v1/v2/v3 =="
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:APKSIGNER_STORE_PASS \
            --key-pass env:APKSIGNER_KEY_PASS \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$ALIGNED"

          mv "$SIGNED" "$APK"
          rm -f "$ALIGNED"

          echo "== Final certificate =="
          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            --min-sdk-version 21 \
            --print-certs \
            "$APK"

      - name: Verify APK integrity and Android 16 KB packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          echo "== ZIP integrity =="
          unzip -t "$APK" >/dev/null

          echo "== APK signature =="
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK"

          echo "== APK alignment =="
          "$BUILD_TOOLS_DIR/zipalign" -v -c -P 16 4 "$APK"

          echo "== Native library packaging =="
          python3 - <<'PY'
          import struct
          import zipfile
          from pathlib import Path

          apk = Path("build/app/outputs/flutter-apk/app-release.apk")
          with zipfile.ZipFile(apk) as zf:
              names = zf.namelist()
              bad_datastore = [
                  name for name in names
                  if name.endswith("libdatastore_shared_counter.so")
              ]
              if bad_datastore:
                  raise SystemExit(
                      "Found DataStore native counter library, which is known to be incompatible with "
                      "16 KB page-size validation in current shared_preferences Android builds:\n"
                      + "\n".join(bad_datastore)
                  )

              libs = [i for i in zf.infolist() if i.filename.endswith(".so")]
              if not libs:
                  raise SystemExit("No native .so libraries found in APK")

              stored = [i.filename for i in libs if i.compress_type == zipfile.ZIP_STORED]
              for info in libs:
                  mode = "compressed" if info.compress_type != zipfile.ZIP_STORED else "stored"
                  print(f"{info.filename}: {mode}")

              if stored:
                  raise SystemExit(
                      "Found uncompressed native libraries. "
                      "16 KB-safe packaging requires JNI libraries to use legacy/compressed packaging.\n"
                      + "\n".join(stored)
                  )

              resource = zf.getinfo("resources.arsc")
              if resource.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("resources.arsc must be uncompressed (STORED) for Android 11+ package parsing.")

              with apk.open("rb") as f:
                  f.seek(resource.header_offset)
                  header = f.read(30)
                  _, _, _, _, _, _, _, _, _, filename_len, extra_len = struct.unpack(
                      "<IHHHHHIIIHH", header
                  )
                  data_offset = resource.header_offset + 30 + filename_len + extra_len

              if data_offset % 4 != 0:
                  raise SystemExit(
                      f"resources.arsc data offset {data_offset} is not 4-byte aligned."
                  )

              print(f"resources.arsc: STORED, data offset {data_offset} (4-byte aligned)")
          PY

          echo "== Manifest/package verification =="
          if command -v aapt2 >/dev/null 2>&1; then
            aapt2 dump badging "$APK" | grep -E '^package:|^sdkVersion:|^targetSdkVersion:'
          else
            echo "aapt2 not available; manifest verification skipped."
          fi

          echo "APK verification passed."

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranKu-testing-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/quranku-release.jks
