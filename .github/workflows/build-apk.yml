name: Build QuranKu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Prepare valid rain background audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p assets
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "anoisesrc=color=pink:duration=30:amplitude=0.18" \
            -af "highpass=f=120,lowpass=f=8000,volume=0.65" \
            -c:a libmp3lame -b:a 96k assets/rain_loop.mp3
          test -s assets/rain_loop.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 assets/rain_loop.mp3

      - name: Apply background audio patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tool/apply_background_audio_patch.py')
          text = p.read_text(encoding='utf-8')
          old = '    rain_path.write_bytes(base64.b64decode(RAIN_MP3_B64))'
          if old in text:
              text = text.replace(old, '    pass', 1)
              p.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile tool/apply_background_audio_patch.py
          python3 tool/apply_background_audio_patch.py
          test -s assets/rain_loop.mp3

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/quranku-release.jks
          test -s android/app/quranku-release.jks

      - name: Align app version with release
        run: |
          VERSION="3.0.${{ github.run_number }}"
          python3 - "$VERSION" <<'PY'
          import pathlib
          import sys

          version = sys.argv[1]
          replacements = {
              'lib/screens/about_screen.dart': [
                  ('final String _appVersion = "1.0.0";', f'final String _appVersion = "{version}";'),
              ],
              'lib/screens/settings_screen.dart': [
                  ("'v3.0.0'", f"'v{version}'"),
              ],
          }

          for filename, pairs in replacements.items():
              path = pathlib.Path(filename)
              text = path.read_text(encoding='utf-8')
              changed = False
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
              if not changed:
                  raise SystemExit(f'Expected version marker not found in {filename}')
              path.write_text(text, encoding='utf-8')
          PY

          grep -n "_appVersion" lib/screens/about_screen.dart
          grep -n "v3.0" lib/screens/settings_screen.dart

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/quranku-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD Secret is missing."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS Secret is missing."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD Secret is missing."; exit 1; }
          flutter build apk \
            --release \
            --build-name "3.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranKu-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.0.${{ github.run_number }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "QuranKu $TAG" \
            --generate-notes

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/quranku-release.jks
